[package]
name = "pookie-cli"
version = "0.0.1"
edition = "2021"

[dependencies]
clap = { version = "4.4.6", features = ["derive"] }
tracing-subscriber = "0.3.18"
lazy_static = "1.4.0"
pookie = { path = "../pookie", version = "0.0.1" }
serde_json = "1.0.107"

[features]
appbound = ["pookie/appbound"]

[[bin]]
name = "pookie"
path = "src/main.rs"
