[workspace]
members = [".", "cli"]
exclude = ["examples/rust/http"]
default-members = ["."]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
description = "Load cookies from web browsers"
license = "(Apache-2.0 OR BSL-1.0 OR Zlib) AND MIT"
homepage = "https://github.com/AldaronLau/pookie/releases"
repository = "https://github.com/AldaronLau/pookie"
keywords = ["browser", "cookie", "decrypt", "load", "web"]
categories = [
  "authentication",
  "config",
  "database",
  "filesystem",
  "web-programming",
]
rust-version = "1.95"

[package]
name = "pookie"
documentation = "https://docs.rs/pookie"
readme = "README.md"
include = [
    "/LICENSE_APACHE",
    "/LICENSE_BOOST",
    "/LICENSE_MIT",
    "/LICENSE_ZLIB",
    "/README.md",
    "/config.json",
    "/examples/*",
    "/src/*",
]
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true

[lib]
name = "pookie"
path = "src/lib.rs"

[dependencies]
indoc = "2.0.7"
aes = "0.9.1"
aes-gcm = "0.11.0"
cbc = "0.2.1"
eyre = { version = "0.6.12" }
glob = "0.3.3"
log = "0.4.33"
lz4_flex = "0.13.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
rust-ini = "0.21.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
url = "2.5.8"
rand = "0.10.2"
once_cell = "1.21.4" # TODO: Remove

[dev-dependencies]
env_logger = "0.11.11"

[features]
default = ["appbound"]
appbound = []

[target.'cfg(unix)'.dependencies]
pbkdf2 = "0.13.0"
sha1 = "0.11.0"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.17.0"
zvariant = "5.13.0"

[target.'cfg(target_os = "macos")'.dependencies]
pbkdf2 = "0.13.0"
sha1 = "0.11.0"
byteorder = "1.5.0" # TODO: Remove

[target.'cfg(windows)'.dependencies]
base64 = "0.22.1" # TODO: Replace
libesedb = "0.2.7"
rawcopy-rs-next = "0.1.3"
privilege = "0.3.0"
windows = { version = "0.62.2", features = [
    "Wdk",
    "Wdk_System",
    "Wdk_System_SystemServices",
    "Win32_Security_Cryptography",
    "Win32_Security",
    "Win32",
    "Win32_Foundation",
    "Win32_System",
    "Win32_System_RestartManager",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[[example]]
name = "simple"
path = "examples/simple.rs"
