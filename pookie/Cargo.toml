[package]
name = "pookie"
version = "0.0.2"
edition = "2024"
description = "Load cookie from your web browsers"
license-file = "../MIT-LICENSE.txt"
homepage = "https://crates.io/crates/pookie"
documentation = "https://docs.rs/pookie/"
repository = "https://github.com/AldaronLau/pookie"
readme = "../README.md"
keywords = ["cookies", "rust", "web"]

[lib]
name = "pookie"
path = "src/lib.rs"

[dependencies]
indoc = "2.0.7"
aes = "0.9.1"
aes-gcm = "0.11.0"
cbc = "0.2.1"
eyre = { version = "0.6.12" }
glob = "0.3.3"
log = "0.4.33"
lz4_flex = "0.13.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
rust-ini = "0.21.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
url = "2.5.8"
rand = "0.10.2"
once_cell = "1.21.4" # TODO: Remove

[dev-dependencies]
tracing-subscriber = "0.3.23"

[features]
default = ["appbound"]
appbound = []

[target.'cfg(unix)'.dependencies]
pbkdf2 = "0.13.0"
sha1 = "0.11.0"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "3" #FIXME
zvariant = "3" #FIXME

[target.'cfg(target_os = "macos")'.dependencies]
pbkdf2 = "0.13.0"
sha1 = "0.11.0"
byteorder = "1.5.0" # TODO: Remove

[target.'cfg(windows)'.dependencies]
base64 = "0.22.1" # TODO: Replace
libesedb = "0.2.7"
rawcopy-rs-next = "0.1.3"
privilege = "0.3.0"
# FIXME Update to 62
windows = { version = "0.51", features = [
    "Wdk",
    "Wdk_System",
    "Wdk_System_SystemServices",
    "Win32_Security_Cryptography",
    "Win32_Security",
    "Win32",
    "Win32_Foundation",
    "Win32_System",
    "Win32_System_RestartManager",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[[example]]
name = "simple"
path = "../examples/simple.rs"

include = ["src/**/*", "Cargo.toml", "Cargo.lock"]
